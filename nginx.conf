server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # фото и сборка не меняются без смены имени — кэшируем надолго
    location ~* \.(webp|jpg|png|svg|js|css|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html всегда свежий — иначе телефон показывает старую версию
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
